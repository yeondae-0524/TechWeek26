; Run this controller with Python 3.10 (numpy available).
; $(LOCALAPPDATA) is expanded by Webots, so the python.org default per-user install
; path works on every teammate's PC. If your Python 3.10 lives elsewhere, edit
; COMMAND locally (do not commit a user-specific path).
[python]
COMMAND = $(LOCALAPPDATA)\Programs\Python\Python310\python.exe
